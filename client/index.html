<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>RT Arena</title>
    <style>
      :root { --bg:#0b1020; --panel:rgba(16,22,44,.86); --accent:#34d399; --accent2:#60a5fa; --text:#eef2ff; --sub:#94a3b8; --danger:#fb7185; }
      * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
      html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; overscroll-behavior:none; }
      #c { position:fixed; inset:0; width:100%; height:100%; display:block; outline:none; touch-action:none; }
      #labels { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
      .lbl { position:absolute; left:0; top:0; will-change:transform; font-size:12px; font-weight:700; padding:2px 7px; border-radius:10px;
        background:rgba(8,12,28,.62); white-space:nowrap; text-shadow:0 1px 2px #000; display:none; }
      .lbl.me { background:rgba(52,211,153,.9); color:#04130d; text-shadow:none; }
      #hud { position:fixed; inset:0; pointer-events:none; display:none;
        padding: env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0); }
      #hud.on { display:block; }
      #top { position:absolute; top:8px; left:50%; transform:translateX(-50%); text-align:center; max-width:46vw; }
      #msg { font-size:clamp(15px,3.4vw,22px); font-weight:800; text-shadow:0 2px 6px #000; }
      #sub { font-size:12px; color:var(--sub); margin-top:2px; }
      #board { position:absolute; top:8px; right:10px; min-width:120px; padding:6px 10px; background:var(--panel); border-radius:12px; font-size:12px; }
      #board div { display:flex; align-items:center; gap:6px; padding:1px 0; }
      #board i { width:9px; height:9px; border-radius:50%; display:inline-block; flex:none; }
      #board b { margin-left:auto; padding-left:10px; }
      #board .me { font-weight:800; color:var(--accent); }
      #feed { position:absolute; top:62px; left:10px; font-size:12px; display:flex; flex-direction:column; gap:3px; }
      #feed div { background:var(--panel); padding:3px 9px; border-radius:9px; animation: feedin .25s ease-out; }
      @keyframes feedin { from { opacity:0; transform:translateX(-14px); } to { opacity:1; transform:none; } }
      .chip { pointer-events:auto; border:0; color:var(--text); background:var(--panel); border-radius:12px; font:inherit; font-size:13px; font-weight:700; padding:8px 12px; }
      #leave { position:absolute; top:8px; left:10px; width:40px; height:40px; padding:0; font-size:18px; }
      #roomchip { position:absolute; top:8px; left:58px; }
      #ping { position:absolute; bottom:6px; left:50%; transform:translateX(-50%); font-size:11px; color:var(--sub); }
      #zone { position:absolute; left:0; top:56px; bottom:0; width:58%; pointer-events:auto; touch-action:none; }
      #stickBase { position:absolute; width:clamp(140px,26vh,200px); height:clamp(140px,26vh,200px); transform:translate(-50%,-50%); border-radius:50%;
        border:3px solid rgba(255,255,255,.38); background:radial-gradient(circle, rgba(255,255,255,.14) 0 38%, rgba(255,255,255,.06) 39% 100%);
        box-shadow:0 0 0 1px rgba(0,0,0,.25) inset, 0 8px 24px rgba(0,0,0,.35); pointer-events:none; opacity:.85; transition:opacity .15s, background .15s; }
      #stickBase.active { opacity:1; border-color:rgba(255,255,255,.6); }
      #stickBase::before, #stickBase::after { content:""; position:absolute; left:50%; top:50%; background:rgba(255,255,255,.16); transform:translate(-50%,-50%); }
      #stickBase::before { width:2px; height:70%; }
      #stickBase::after { width:70%; height:2px; }
      #stickKnob { position:absolute; left:50%; top:50%; width:46%; height:46%; margin:-23% 0 0 -23%; border-radius:50%;
        background:radial-gradient(circle at 35% 30%, #ffffff, #cbd5e1); box-shadow:0 4px 14px rgba(0,0,0,.5); z-index:1; }
      #dash { position:absolute; right:calc(env(safe-area-inset-right,0px) + 34px); bottom:calc(env(safe-area-inset-bottom,0px) + 30px); width:clamp(112px,25vh,170px); height:clamp(112px,25vh,170px); border-radius:50%; pointer-events:auto;
        border:4px solid rgba(255,255,255,.55); color:#06210f; font-weight:900; font-size:clamp(18px,3.4vh,26px); letter-spacing:1px; touch-action:none;
        box-shadow:0 8px 24px rgba(0,0,0,.5);
        background: conic-gradient(rgba(15,23,42,.8) var(--cd,0deg), var(--accent) 0); transition:transform .08s; }
      #dash.ready { box-shadow:0 0 0 6px rgba(52,211,153,.35), 0 8px 24px rgba(0,0,0,.5); }
      #dash:active { transform:scale(.92); }
      #banner { position:fixed; left:50%; top:34%; transform:translate(-50%,-50%); font-size:clamp(34px,9vw,72px); font-weight:900; letter-spacing:1px;
        text-shadow:0 4px 18px rgba(0,0,0,.65); pointer-events:none; opacity:0; text-align:center; }
      #banner.show { animation: pop var(--dur,900ms) ease-out forwards; }
      @keyframes pop { 0% { opacity:0; transform:translate(-50%,-50%) scale(.6); } 15% { opacity:1; transform:translate(-50%,-50%) scale(1.08); }
        25% { transform:translate(-50%,-50%) scale(1); } 80% { opacity:1; } 100% { opacity:0; transform:translate(-50%,-60%) scale(1); } }
      #menu { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:12px; overflow:auto; touch-action:pan-y;
        background:radial-gradient(ellipse at 50% 20%, rgba(11,16,32,.35), rgba(11,16,32,.82)); transition:opacity .25s; }
      #menu.hide { opacity:0; pointer-events:none; }
      .card { width:min(430px,100%); background:var(--panel); border-radius:22px; padding:18px 18px 14px; backdrop-filter:blur(6px); box-shadow:0 20px 60px rgba(0,0,0,.45); }
      h1 { margin:0; font-size:34px; letter-spacing:2px; font-weight:900; background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
      .tag { color:var(--sub); font-size:13px; margin:2px 0 12px; }
      input[type=text] { width:100%; font:inherit; font-size:16px; color:var(--text); background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); border-radius:12px; padding:12px 14px; outline:none; user-select:text; -webkit-user-select:text; }
      input[type=text]:focus { border-color:var(--accent); }
      .btn { width:100%; border:0; border-radius:14px; font:inherit; font-size:16px; font-weight:800; padding:14px; margin-top:10px; color:#04130d; background:linear-gradient(90deg,var(--accent),#5eead4); }
      .btn:active { transform:scale(.98); }
      .btn:disabled { opacity:.5; }
      .btn.alt { color:var(--text); background:rgba(255,255,255,.1); }
      .row { display:flex; gap:8px; margin-top:10px; }
      .row input { flex:1; text-transform:uppercase; letter-spacing:4px; text-align:center; }
      .row .btn { margin-top:0; width:auto; padding:12px 18px; }
      #status { min-height:18px; font-size:13px; color:var(--danger); margin-top:10px; text-align:center; }
      .how { font-size:12px; color:var(--sub); margin-top:10px; line-height:1.5; text-align:center; }
      .links { display:flex; justify-content:space-between; margin-top:10px; font-size:12px; color:var(--sub); }
      .links a { color:var(--sub); text-decoration:underline; padding:4px 2px; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="labels"></div>

    <div id="hud">
      <div id="top"><div id="msg"></div><div id="sub"></div></div>
      <div id="board"></div>
      <div id="feed"></div>
      <button id="leave" class="chip" aria-label="Leave">&#10005;</button>
      <button id="roomchip" class="chip" hidden></button>
      <div id="ping"></div>
      <div id="zone"><div id="stickBase"><div id="stickKnob"></div></div></div>
      <button id="dash">DASH</button>
    </div>

    <div id="banner"></div>

    <div id="menu">
      <div class="card">
        <h1>RT ARENA</h1>
        <div class="tag">Shove everyone off the platform. Last one standing wins.</div>
        <input id="name" type="text" maxlength="14" placeholder="Your name" autocomplete="off" />
        <button id="play" class="btn">Quick Play</button>
        <button id="create" class="btn alt">Create Private Room</button>
        <div class="row">
          <input id="code" type="text" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" />
          <button id="join" class="btn alt">Join</button>
        </div>
        <div id="status"></div>
        <div class="how">Drag on the left side to move &middot; Tap <b>DASH</b> to ram &middot; Keyboard: WASD / arrows + Space</div>
        <div class="links">
          <a id="quality">Graphics: Medium</a>
          <a id="sound">Sound: On</a>
          <a id="server">Server</a>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
